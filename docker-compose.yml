services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hemayatgar
      POSTGRES_PASSWORD: hemayatgar_secret
      POSTGRES_DB: hemayatgar_insurance
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hemayatgar:hemayatgar_secret@postgres:5432/hemayatgar_insurance
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: https://api.bime123.com
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
